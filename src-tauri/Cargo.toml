[package]
name = "lite"
version = "0.0.24"
description = "A fast, local workspace for AI coding agents."
authors = ["Ultralytics"]
edition = "2024"
license = "AGPL-3.0"
homepage = "https://www.ultralytics.com"
repository = "https://github.com/ultralytics/lite"
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
atomicwrites = "0.4.4"
portable-pty = "0.9.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2.7.2"
tungstenite = "0.30"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
