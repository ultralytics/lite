# Build native installers and publish a GitHub release when Cargo.toml version changes

name: Publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  check:
    if: github.repository == 'ultralytics/lite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      increment: ${{ steps.release.outputs.increment }}
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps --manifest-path src-tauri/Cargo.toml | jq -r '.packages[0].version')
          TAG="v$VERSION"
          RELEASE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s --arg tag "$TAG" 'map(.[]) | map(select(.tag_name == $tag)) | first // empty')
          if [ -n "$RELEASE" ]; then
            if [ "$(jq -r .draft <<< "$RELEASE")" != "true" ]; then
              echo "increment=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RELEASE_ID=$(jq -r .id <<< "$RELEASE")
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f target_commitish="$GITHUB_SHA" >/dev/null
          else
            RELEASE_ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="Lite $TAG" \
              -f body="Download the installer for your operating system below. Lite runs locally and uses your existing Claude Code and Codex authentication. The release includes a cross-platform source and dependency SBOM." \
              -f target_commitish="$GITHUB_SHA" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq .id)
          fi
          {
            echo "increment=true"
            echo "release_id=$RELEASE_ID"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.increment == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: bun ci
      - run: bun run check
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.check.outputs.release_id }}
          releaseDraft: true
          releaseAssetNamePattern: Lite_[version]_[platform]_[arch][setup][ext]
          retryAttempts: 2
          tagName: ${{ needs.check.outputs.tag }}
          tauriScript: bun run tauri
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: false

  sbom:
    needs: check
    if: needs.check.outputs.increment == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --production
      - uses: anchore/sbom-action@v0.24.0
        env:
          SYFT_SOURCE_NAME: Lite
          SYFT_SOURCE_VERSION: ${{ needs.check.outputs.tag }}
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Validate and upload SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          jq -e --arg version "${TAG#v}" '.spdxVersion == "SPDX-2.3" and .name == "Lite" and any(.packages[]; .name == "lite" and .versionInfo == $version)' sbom.spdx.json >/dev/null
          jq -e '[.packages[].externalRefs[]? | select(.referenceType == "purl") | .referenceLocator] | any(startswith("pkg:cargo/")) and any(startswith("pkg:npm/"))' sbom.spdx.json >/dev/null
          gh release upload "$TAG" sbom.spdx.json --clobber

  publish:
    needs: [check, build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")
          VERSION=${TAG#v}
          jq -e --arg version "$VERSION" '([.[].name] | sort) == (["Lite_\($version)_darwin_aarch64.app.tar.gz", "Lite_\($version)_darwin_aarch64.dmg", "Lite_\($version)_linux_amd64.AppImage", "Lite_\($version)_windows_x64-setup.exe", "latest.json", "sbom.spdx.json"] | sort)' <<< "$ASSETS" >/dev/null
          LATEST_ID=$(jq -r 'map(select(.name == "latest.json")) | first.id // empty' <<< "$ASSETS")
          test -n "$LATEST_ID"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$LATEST_ID" > "$RUNNER_TEMP/latest.json"
          jq -e --arg version "$VERSION" '.version == $version' "$RUNNER_TEMP/latest.json" >/dev/null
          for PLATFORM in darwin-aarch64-app linux-x86_64-appimage windows-x86_64-nsis; do
            jq -e --arg platform "$PLATFORM" '.platforms[$platform] | (.url | type == "string" and length > 0) and (.signature | type == "string" and length > 0)' "$RUNNER_TEMP/latest.json" >/dev/null
            ASSET_ID=$(jq -r --arg platform "$PLATFORM" '.platforms[$platform].url | capture("/assets/(?<id>[0-9]+)$").id' "$RUNNER_TEMP/latest.json")
            jq -e --argjson id "$ASSET_ID" 'any(.id == $id)' <<< "$ASSETS" >/dev/null
          done
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
