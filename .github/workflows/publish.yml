# Build native installers and publish a GitHub release when Cargo.toml version changes

name: Publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  check:
    if: github.repository == 'ultralytics/lite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      increment: ${{ steps.release.outputs.increment }}
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve release for this version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps --manifest-path src-tauri/Cargo.toml | jq -r '.packages[0].version')
          TAG="v$VERSION"
          RELEASE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s --arg tag "$TAG" 'map(.[]) | map(select(.tag_name == $tag)) | first // empty')
          if [ -n "$RELEASE" ]; then
            if [ "$(jq -r .draft <<< "$RELEASE")" != "true" ]; then
              echo "increment=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          GENERATED=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body)
          BODY=$(printf '%s\n\n<!-- lite-release-notes:start -->\n%s\n<!-- lite-release-notes:end -->' \
            "Download the installer for your operating system below. Lite runs locally and uses your existing Claude Code and Codex authentication. The release includes a cross-platform source and dependency SBOM." \
            "$GENERATED")
          if [ -n "$RELEASE" ]; then
            RELEASE_ID=$(jq -r .id <<< "$RELEASE")
            jq -n --arg target "$GITHUB_SHA" --arg body "$BODY" '{target_commitish: $target, body: $body}' |
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input - >/dev/null
          else
            RELEASE_ID=$(jq -n --arg tag "$TAG" --arg target "$GITHUB_SHA" --arg body "$BODY" \
              '{tag_name: $tag, name: ("Lite " + $tag), body: $body, target_commitish: $target, draft: true}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input - --jq .id)
          fi
          {
            echo "increment=true"
            echo "release_id=$RELEASE_ID"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.increment == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release
          workspaces: src-tauri
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install dependencies
        run: bun ci
      - name: Lint and typecheck
        run: bun run check
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.check.outputs.release_id }}
          releaseDraft: true
          releaseAssetNamePattern: Lite_[version]_[platform]_[arch][setup][ext]
          retryAttempts: 2
          tagName: ${{ needs.check.outputs.tag }}
          tauriScript: bun run tauri
          # The builds run in parallel, so none of them writes the shared latest.json; the publish job
          # writes it once from the signatures each build hands over below.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
      - name: Hand over updater signature
        uses: actions/upload-artifact@v7
        with:
          name: signature-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 1

  sbom:
    needs: check
    if: needs.check.outputs.increment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install production dependencies
        run: bun install --frozen-lockfile --production
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.3
        env:
          SYFT_SOURCE_NAME: Lite
          SYFT_SOURCE_VERSION: ${{ needs.check.outputs.tag }}
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Validate and upload SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          jq -e --arg version "${TAG#v}" '.spdxVersion == "SPDX-2.3" and .name == "Lite" and any(.packages[]; .name == "lite" and .versionInfo == $version)' sbom.spdx.json >/dev/null
          jq -e '[.packages[].externalRefs[]? | select(.referenceType == "purl") | .referenceLocator] | any(startswith("pkg:cargo/")) and any(startswith("pkg:npm/"))' sbom.spdx.json >/dev/null
          gh release upload "$TAG" sbom.spdx.json --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [check, build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download updater signatures
        uses: actions/download-artifact@v8
        with:
          pattern: signature-*
          path: ${{ runner.temp }}/signatures
      - name: Write updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")
          VERSION=${TAG#v}
          NOTES=$(jq -r '.body | capture("<!-- lite-release-notes:start -->\\n(?<notes>[\\s\\S]*?)\\n<!-- lite-release-notes:end -->").notes' <<< "$RELEASE")
          MANIFEST=$(jq -n --arg version "$VERSION" --arg notes "$NOTES" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{version: $version, notes: $notes, pub_date: $date, platforms: {}}')
          # Each target's updater bundle, and the two names the updater may look it up by.
          while read -r TARGET ASSET PLATFORMS; do
            URL=$(jq -r --arg name "$ASSET" 'map(select(.name == $name)) | first.url // empty' <<< "$ASSETS")
            test -n "$URL"
            SIGNATURE=$(find "$RUNNER_TEMP/signatures/signature-$TARGET" -name '*.sig' -exec cat {} +)
            test -n "$SIGNATURE"
            for PLATFORM in ${PLATFORMS//,/ }; do
              MANIFEST=$(jq --arg platform "$PLATFORM" --arg url "$URL" --arg signature "$SIGNATURE" '.platforms[$platform] = {signature: $signature, url: $url}' <<< "$MANIFEST")
            done
          done <<EOF
          aarch64-apple-darwin Lite_${VERSION}_darwin_aarch64.app.tar.gz darwin-aarch64,darwin-aarch64-app
          x86_64-unknown-linux-gnu Lite_${VERSION}_linux_amd64.AppImage linux-x86_64,linux-x86_64-appimage
          x86_64-pc-windows-msvc Lite_${VERSION}_windows_x64-setup.exe windows-x86_64,windows-x86_64-nsis
          EOF
          printf '%s\n' "$MANIFEST" > "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")
          VERSION=${TAG#v}
          jq -e --arg version "$VERSION" '([.[].name] | sort) == (["Lite_\($version)_darwin_aarch64.app.tar.gz", "Lite_\($version)_darwin_aarch64.dmg", "Lite_\($version)_linux_amd64.AppImage", "Lite_\($version)_windows_x64-setup.exe", "latest.json", "sbom.spdx.json"] | sort)' <<< "$ASSETS" >/dev/null
          LATEST_ID=$(jq -r 'map(select(.name == "latest.json")) | first.id // empty' <<< "$ASSETS")
          test -n "$LATEST_ID"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$LATEST_ID" > "$RUNNER_TEMP/latest.json"
          jq -e --arg version "$VERSION" '.version == $version and (.notes | type == "string" and length > 0)' "$RUNNER_TEMP/latest.json" >/dev/null
          for PLATFORM in darwin-aarch64-app linux-x86_64-appimage windows-x86_64-nsis; do
            jq -e --arg platform "$PLATFORM" '.platforms[$platform] | (.url | type == "string" and length > 0) and (.signature | type == "string" and length > 0)' "$RUNNER_TEMP/latest.json" >/dev/null
            ASSET_ID=$(jq -r --arg platform "$PLATFORM" '.platforms[$platform].url | capture("/assets/(?<id>[0-9]+)$").id' "$RUNNER_TEMP/latest.json")
            jq -e --argjson id "$ASSET_ID" 'any(.id == $id)' <<< "$ASSETS" >/dev/null
          done
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
