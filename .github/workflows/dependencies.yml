# Scheduled automation — consolidates recurring maintenance into single PRs instead of per-PR commits.

name: Dependencies

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ultralytics/lite'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets._GITHUB_TOKEN }}

      - name: Git config
        run: |
          git config --global user.name "UltralyticsAssistant"
          git config --global user.email "web@ultralytics.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update dependencies
        # Without --latest, bun keeps the locked version even when the declared range allows a newer
        # one, so `bun update` reports "no changes" against an outdated lockfile.
        # Version ceilings belong in the root "overrides" block — it survives --latest.
        run: |
          bun update --latest
          cargo update --manifest-path src-tauri/Cargo.toml

      - name: Open PR, wait for CI, then merge
        env:
          GH_TOKEN: ${{ secrets._GITHUB_TOKEN }}
        run: |
          branch="chore/dependencies-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git add -u
          if git diff --staged --quiet; then
            echo "No dependency updates available — skipping PR."
            exit 0
          fi
          git commit -m "Auto-update dependencies"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --title "Auto-update dependencies" \
            --body "Automated \`bun update --latest\` and \`cargo update\`. Crosses semver ranges, so review majors. Version ceilings live in the root \`overrides\` block." \
            --base main \
            --head "$branch" \
            --label dependencies)
          echo "PR opened: $pr_url"

          sleep 60 # Let format.yml + CI register their checks before --watch
          gh pr checks "$pr_url" --watch --fail-fast
          gh pr merge "$pr_url" --squash --delete-branch --admin
