name: Feature request
description: Suggest one focused improvement to Lite.
title: ""
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Search
      options:
        - label: I searched existing Lite issues.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What feels difficult or missing today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Simple solution
      description: What is the smallest useful change?
    validations:
      required: true
