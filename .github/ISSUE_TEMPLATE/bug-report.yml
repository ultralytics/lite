name: 🐛 Bug Report
# title: " "
description: Problems with Ultralytics Lite
labels: [bug, triage]
type: "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting an Ultralytics Lite 🐛 Bug Report!

  - type: checkboxes
    attributes:
      label: Search before asking
      description: >
        Please search the Ultralytics Lite [README](https://github.com/ultralytics/lite#readme) and [issues](https://github.com/ultralytics/lite/issues) to see if a similar bug report already exists.
      options:
        - label: >
            I have searched the Ultralytics Lite [issues](https://github.com/ultralytics/lite/issues) and found no similar bug report.
          required: true

  - type: dropdown
    attributes:
      label: Lite Component
      description: |
        Please select the component where you found the bug.
      multiple: true
      options:
        - "Install"
        - "Updater"
        - "Sessions and tabs"
        - "Terminal"
        - "Provider sign-in"
        - "API keys"
        - "File browser"
        - "Code preview"
        - "Git"
        - "Theme"
        - "Documentation"
        - "Other"
    validations:
      required: false

  - type: textarea
    attributes:
      label: Bug
      description: Please provide as much information as possible. Copy and paste console output and error messages including the _full_ traceback. Use [Markdown](https://docs.github.com/en/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax) to format text, code and logs. If necessary, include screenshots for visual elements only. Remove API keys and other secrets before sharing logs. Providing detailed information will help us resolve the issue more efficiently.
      placeholder: |
        💡 ProTip! Include as much information as possible (logs, tracebacks, screenshots, etc.) to receive the most helpful response.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Please provide your system information to help us diagnose the problem.
      placeholder: |
        Please include:
        - OS (e.g., macOS 26.0, Windows 11, Ubuntu 24.04)
        - Lite version (e.g., 0.0.33)
        - Provider CLI and version (e.g., claude 2.1.0, codex-cli 0.146.0, gemini 0.9.0)
        - Any relevant environment details

        Example:
        ```
        OS: macOS 26.0
        Lite: 0.0.33
        Provider: codex-cli 0.146.0
        Shell: zsh
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Minimal Reproducible Example
      description: >
        When asking a question, people will be better able to provide help if you provide the exact steps they can follow to **reproduce** the problem. This is referred to by community members as creating a [minimal reproducible example](https://docs.ultralytics.com/help/minimum-reproducible-example/).
      placeholder: |
        1. Open Lite and start a new session with ...
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional
      description: Anything else you would like to share?

  - type: checkboxes
    attributes:
      label: Are you willing to submit a PR?
      description: >
        (Optional) We encourage you to submit a [Pull Request](https://github.com/ultralytics/lite/pulls) (PR) to help improve Ultralytics software for everyone, especially if you have a good understanding of how to implement a fix or feature.
        See the Ultralytics [Contributing Guide](https://docs.ultralytics.com/help/contributing) to get started.
      options:
        - label: Yes I'd like to help by submitting a PR!
