name: Bug report
description: Tell us what went wrong in Lite.
title: ""
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Search
      options:
        - label: I searched existing Lite issues.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Include the steps to reproduce the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include your OS, Lite version, and relevant Claude Code or Codex CLI version.
      placeholder: "macOS 26.0 · Lite version · codex-cli 0.146.0"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or screenshots
      description: Optional. Remove secrets before sharing logs.
